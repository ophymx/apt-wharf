# nfpm config for packaging the apt-signpost binary itself.
#
# Build:
#   go build -trimpath -ldflags="-s -w" -o signpost ./cmd/signpost
#   VERSION=0.1.0 nfpm pkg --packager deb -f nfpm.yaml -t dist/
#
# Override arch by setting GOARCH at build time and ARCH for nfpm:
#   GOARCH=arm64 go build ... && ARCH=arm64 VERSION=0.1.0 nfpm pkg ...

name: apt-signpost
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Ophymx <ops@ophymx.com>
vendor: Ophymx
homepage: https://github.com/ophymx/apt-signpost
description: |
  Stitch external .deb downloads into a signed apt repository.
  apt-signpost hosts and signs the apt metadata (InRelease, Release,
  Packages*) and HTTP-redirects .deb fetches to upstream URLs, so it
  never re-hosts vendor binaries. Discovery sources include direct URLs,
  GitHub releases, and external commands.

contents:
  - src: ./signpost
    dst: /usr/bin/signpost
    file_info:
      mode: 0755

  - src: ./packaging/systemd/signpost.service
    dst: /lib/systemd/system/signpost.service
    file_info:
      mode: 0644

  - src: ./config.example.yaml
    dst: /etc/signpost/config.yaml
    type: config|noreplace
    file_info:
      mode: 0640

  # Ownership of the dirs and conffile below is set by postinstall once the
  # signpost user/group exist. dpkg extracts by numeric uid/gid from the tar
  # headers (always 0/0 here), so naming the owner in file_info would be a
  # silent no-op.
  - dst: /var/lib/signpost
    type: dir
    file_info:
      mode: 0750

  - dst: /etc/signpost
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

deb:
  fields:
    Bugs: https://github.com/ophymx/apt-signpost/issues
