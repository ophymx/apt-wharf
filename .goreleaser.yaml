# Goreleaser config for the apt-signpost / apt-cooper / apt-drayman /
# apt-staves / apt-chandler binaries.
#
# Local snapshot build (no tag required):
#   goreleaser release --snapshot --clean
#
# Output lands in dist/. GitHub release publishing is disabled below; this
# config is only the local build pipeline.
#
# cmd/discover-zoom is intentionally not built here — it's example code for
# signpost's external-producer contract, not a shipped binary.

version: 2

project_name: apt-wharf

builds:
  - id: signpost
    binary: signpost
    main: ./cmd/signpost
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: cooper
    binary: cooper
    main: ./cmd/cooper
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: chandler
    binary: chandler
    main: ./cmd/chandler
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: drayman
    binary: drayman
    main: ./cmd/drayman
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: staves
    binary: staves
    main: ./cmd/staves
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

archives:
  - id: signpost
    ids: [signpost]
    name_template: "apt-signpost_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

  - id: cooper
    ids: [cooper]
    name_template: "apt-cooper_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

  - id: chandler
    ids: [chandler]
    name_template: "apt-chandler_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

  - id: drayman
    ids: [drayman]
    name_template: "apt-drayman_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

  - id: staves
    ids: [staves]
    name_template: "apt-staves_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

nfpms:
  - id: signpost
    package_name: apt-signpost
    ids: [signpost]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    description: |
      Stitch external .deb downloads into a signed apt repository.
      apt-signpost hosts and signs the apt metadata (InRelease, Release,
      Packages*) and HTTP-redirects .deb fetches to upstream URLs, so it
      never re-hosts vendor binaries. Discovery sources include direct URLs,
      GitHub releases, and external commands.
    section: net
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    contents:
      - src: ./packaging/systemd/signpost.service
        dst: /lib/systemd/system/signpost.service
        file_info:
          mode: 0644

      - src: ./config.example.yaml
        dst: /etc/signpost/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640

      # Ownership of the dirs and conffile is set by postinstall once the
      # signpost user/group exist. dpkg extracts by numeric uid/gid from
      # tar headers (always 0/0 here), so naming the owner in file_info
      # would be a silent no-op.
      - dst: /var/lib/signpost
        type: dir
        file_info:
          mode: 0750

      - dst: /etc/signpost
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: ./packaging/scripts/postinstall.sh
      preremove: ./packaging/scripts/preremove.sh
      postremove: ./packaging/scripts/postremove.sh
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

  - id: cooper
    package_name: apt-cooper
    ids: [cooper]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    # Runtime dependency: cooper execs `nfpm` from PATH during `cooper build`.
    # nfpm is not in Debian's apt archive, so it is not declared as Depends
    # here; install it separately (e.g. from goreleaser's nfpm .deb release).
    description: |
      Turn GitHub release binaries into reproducible .deb files.
      apt-cooper is a two-phase CLI (discover -> plan.json -> build) that
      resolves a YAML recipe against a GitHub release, then exec's nfpm to
      produce a byte-identical .deb for the same inputs. Pairs with
      any apt-repo manager (aptly, reprepro, ...).
    section: devel
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

  - id: chandler
    package_name: apt-chandler
    ids: [chandler]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    # chandler emits plan.Plan JSON for cooper-build to consume; the actual
    # .deb production runs through cooper, which execs nfpm. Declared
    # alongside cooper so the two ship as a pair.
    description: |
      Turn vendor curl|sudo-tee install rituals into reproducible
      keyring + sources .debs. apt-chandler is a discover-only CLI that
      reads a YAML config, fetches and dearmors GPG keys over HTTPS,
      renders deb822 .sources files, and emits a plan.Plan JSON
      document for `cooper build -` to turn into a .deb. Replaces the
      typical README install ritual with a reproducible, version-tracked
      package.
    section: devel
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

  - id: drayman
    package_name: apt-drayman
    ids: [drayman]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    # Runtime dependencies: drayman shells out to the configured apt-repo
    # manager (aptly or reprepro). Not declared as Depends since either
    # backend may be chosen.
    description: |
      Orchestrate cooper / chandler / staves output into an apt repo.
      apt-drayman consumes plan.Plan JSON from any compatible producer,
      dedups against the target apt repo by X-Cooper-Build-Inputs-Hash,
      applies revision auto-bump policy, and pushes .debs into aptly or
      reprepro.
    section: devel
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

  - id: staves
    package_name: apt-staves
    ids: [staves]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    # Pairs with cooper the same way chandler does — staves emits a
    # plan.Plan for `cooper build -` to consume.
    description: |
      Package locally-checked-in files (configs, systemd units, scripts)
      as reproducible .debs. apt-staves is a discover-only CLI that
      walks a directory of nfpm.yaml + payload files, derives
      source_date_epoch from git commit time, and emits a plan.Plan
      JSON document for `cooper build -` to turn into a .deb. Fills the
      "in-house config package" niche that cooper (upstream binaries)
      and chandler (vendor keyrings) don't cover.
    section: devel
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
