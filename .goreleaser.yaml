# Goreleaser config for the apt-wharf project, packaged as two .debs:
#   apt-signpost — the repo-serving daemon (own package; runs as a
#                  long-running systemd unit with its own user/dirs).
#   apt-wharf    — the build/orchestrate toolchain: cooper, chandler,
#                  staves, drayman bundled together. Stateless CLIs
#                  meant to be installed and used as a set; splitting
#                  them per-tool was over-fragmentation.
#
# Local snapshot build (no tag required):
#   goreleaser release --snapshot --clean
#
# Output lands in dist/. GitHub release publishing is disabled below; this
# config is only the local build pipeline.
#
# Example external-producer code lives under examples/external-producers/
# (e.g. discover-zoom). Those are buildable reference programs, not
# shipped binaries.

version: 2

project_name: apt-wharf

builds:
  - id: signpost
    binary: signpost
    main: ./cmd/signpost
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ophymx/apt-wharf/internal/version.Version={{ .Version }}
      - -X github.com/ophymx/apt-wharf/internal/version.Commit={{ .Commit }}
      - -X github.com/ophymx/apt-wharf/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: cooper
    binary: cooper
    main: ./cmd/cooper
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ophymx/apt-wharf/internal/version.Version={{ .Version }}
      - -X github.com/ophymx/apt-wharf/internal/version.Commit={{ .Commit }}
      - -X github.com/ophymx/apt-wharf/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: chandler
    binary: chandler
    main: ./cmd/chandler
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ophymx/apt-wharf/internal/version.Version={{ .Version }}
      - -X github.com/ophymx/apt-wharf/internal/version.Commit={{ .Commit }}
      - -X github.com/ophymx/apt-wharf/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: drayman
    binary: drayman
    main: ./cmd/drayman
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ophymx/apt-wharf/internal/version.Version={{ .Version }}
      - -X github.com/ophymx/apt-wharf/internal/version.Commit={{ .Commit }}
      - -X github.com/ophymx/apt-wharf/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

  - id: staves
    binary: staves
    main: ./cmd/staves
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ophymx/apt-wharf/internal/version.Version={{ .Version }}
      - -X github.com/ophymx/apt-wharf/internal/version.Commit={{ .Commit }}
      - -X github.com/ophymx/apt-wharf/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64, arm, riscv64]
    goarm: ["7"]

archives:
  - id: signpost
    ids: [signpost]
    name_template: "apt-signpost_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

  - id: wharf
    ids: [cooper, chandler, drayman, staves]
    name_template: "apt-wharf_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

nfpms:
  - id: signpost
    package_name: apt-signpost
    ids: [signpost]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    license: MIT
    description: |
      Stitch external .deb downloads into a signed apt repository.
      apt-signpost hosts and signs the apt metadata (InRelease, Release,
      Packages*) and HTTP-redirects .deb fetches to upstream URLs, so it
      never re-hosts vendor binaries. Discovery sources include direct URLs,
      GitHub releases, and external commands.
    section: net
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    contents:
      - src: ./packaging/systemd/signpost.service
        dst: /lib/systemd/system/signpost.service
        file_info:
          mode: 0644

      - src: ./config.example.yaml
        dst: /etc/signpost/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640

      # Reference shim wiring signpost's external-signing contract to
      # vault-pgp-sign(1). Ships under /usr/share/doc; operators copy it
      # somewhere on PATH and reference it from signing.external.command.
      - src: ./packaging/contrib/vault-pgp-sign-shim.sh
        dst: /usr/share/doc/apt-signpost/contrib/vault-pgp-sign-shim.sh
        file_info:
          mode: 0755

      # Ownership of the dirs and conffile is set by postinstall once the
      # signpost user/group exist. dpkg extracts by numeric uid/gid from
      # tar headers (always 0/0 here), so naming the owner in file_info
      # would be a silent no-op.
      - dst: /var/lib/signpost
        type: dir
        file_info:
          mode: 0750

      - dst: /etc/signpost
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: ./packaging/scripts/postinstall.sh
      preremove: ./packaging/scripts/preremove.sh
      postremove: ./packaging/scripts/postremove.sh
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

  - id: wharf
    package_name: apt-wharf
    ids: [cooper, chandler, drayman, staves]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ophymx
    homepage: https://github.com/ophymx/apt-wharf
    maintainer: Ophymx <ops@ophymx.com>
    license: MIT
    # Replaces the per-tool packages shipped through v0.1.4. apt installs
    # apt-wharf cleanly over an existing apt-{cooper,chandler,drayman,staves}
    # because Replaces+Conflicts gives apt permission to remove the old
    # ones and overwrite the same /usr/bin/* paths.
    replaces:
      - apt-cooper
      - apt-chandler
      - apt-drayman
      - apt-staves
    conflicts:
      - apt-cooper
      - apt-chandler
      - apt-drayman
      - apt-staves
    provides:
      - apt-cooper
      - apt-chandler
      - apt-drayman
      - apt-staves
    # Runtime dependency: cooper execs `nfpm` from PATH during `cooper build`.
    # nfpm is not in Debian's apt archive, so it is not declared as Depends
    # here; install it separately (e.g. from goreleaser's nfpm .deb release).
    # drayman also shells out to the configured apt-repo manager (aptly or
    # reprepro); not declared because either backend may be chosen.
    description: |
      The apt-wharf build/orchestrate/publish toolchain, bundled.
      Includes:

        - cooper:   turn GitHub-released binaries into reproducible
                    .debs via a two-phase JSON contract
                    (discover -> plan.json -> build), exec'ing nfpm.
        - chandler: turn vendor "curl URL | sudo tee" install rituals
                    into reproducible keyring + sources .debs.
        - staves:   package locally-checked-in files (configs,
                    systemd units, scripts) as reproducible .debs.
        - drayman:  orchestrate cooper / chandler / staves output
                    into an aptly or reprepro apt repo, dedup'd by
                    X-Cooper-Build-Inputs-Hash with auto-bump policy.

      Pairs with apt-signpost (separate package) for the metadata-
      serving side of the stack.
    section: devel
    priority: optional
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    deb:
      fields:
        Bugs: https://github.com/ophymx/apt-wharf/issues

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
