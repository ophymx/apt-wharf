github:
  token_env: GITHUB_TOKEN

# One recipe file (./packages/ollama.yaml) produces two .debs —
# ollama and libollama-nvidia — from a single ollama-linux-${ARCH}.tgz
# upstream resolution. Doc 1 inside that file resolves the release;
# docs 2..N each describe one .deb. See cooper-design.md
# §"Per-package multi-doc file" for the shape.
packages:
  - ./packages/ollama.yaml
