github:
  token_env: GITHUB_TOKEN

# One cooper.yaml can declare multiple packages. Both ollama and
# libollama-nvidia pull from the same upstream tarball
# (ollama/ollama's `ollama-linux-${ARCH}.tar.zst`); they just slice
# different paths out of it via doc 2's contents:.
packages:
  - ./packages/ollama.yaml
  - ./packages/libollama-nvidia.yaml
