# apt-signpost configuration.
#
# Installed by the apt-signpost package as /etc/signpost/config.yaml. Conffile,
# so dpkg will not overwrite local edits on upgrade. The signpost.service unit
# loads this file as user signpost.
#
# Fields marked CHANGEME below must be edited before the daemon will start.
# Env interpolation: $-brace references in values are expanded from the
# process environment; unset or empty references are a fatal config error.
# Schema reference: design.md (Configuration section).

# ---- Repository identity --------------------------------------------------
# Origin/Label appear in the signed Release file. base_url is the public root
# under which apt clients will see /dists/ and /pool/ — no trailing slash, no
# path component.
repository:
  origin: "CHANGEME"                          # e.g. "Acme"
  label: "CHANGEME"                           # e.g. "Acme APT"
  base_url: "https://apt.example.invalid"     # CHANGEME — public root

# ---- Suite ----------------------------------------------------------------
# Single suite in the MVP. Codename appears in /dists/<codename>/.
suite:
  codename: "stable"
  description: "stable channel"
  architectures: ["amd64", "arm64"]           # do not include "all" — implicit

# ---- Bootstrap package ----------------------------------------------------
# The keyring/sources .deb that signpost builds and serves. Installs:
#   /usr/share/keyrings/<package_name>.gpg
#   /etc/apt/sources.list.d/<package_name>.sources   (deb822, Signed-By the keyring)
# Versioning is automatic: YYYY.MM.DD.N
bootstrap:
  package_name: "changeme-archive-keyring"    # CHANGEME — what users `apt install`
  maintainer: "CHANGEME <ops@example.invalid>"
  description: |
    APT repository signing key and sources list.

# ---- Signing --------------------------------------------------------------
# key_file must be readable by the signpost user (mode 0400, owner signpost).
# To bootstrap a fresh install for local testing, flip auto_generate to true:
# signpost will create an unencrypted RSA key at key_file on first start. For
# any production deployment, generate the key offline and copy it in.
signing:
  key_file: "/var/lib/signpost/secring.gpg"
  auto_generate: false
  # Pick at most one passphrase source. Omit both for an unencrypted key.
  # passphrase_env: "SIGNPOST_GPG_PASSPHRASE"
  # passphrase_file: "/var/lib/signpost/passphrase"
  # next_pubkey_file: "/var/lib/signpost/next.pub"   # ships in the keyring for rotation

# ---- HTTP server ----------------------------------------------------------
# Listen on loopback by default; front with a reverse proxy for TLS and
# caching. Change to ":8080" to expose directly.
server:
  listen: "127.0.0.1:8080"

# ---- Refresh loop ---------------------------------------------------------
refresh:
  interval: "1h"
  jitter: "5m"
  http_timeout: "60s"

# ---- GitHub --------------------------------------------------------------
# Optional. Without a token the unauthenticated rate limit (60/hr per IP)
# applies and is shared across all github_release sources.
github:
  # token_env: "GITHUB_TOKEN"
  # token_file: "/var/lib/signpost/github-token"
  rate_limit:
    unauthenticated_per_hour: 50
    authenticated_per_hour: 4500

# ---- Filesystem paths -----------------------------------------------------
# state_dir is created under /var/lib/signpost (provisioned signpost:signpost
# 0750 by the package postinstall). The served repository is held in memory
# and rebuilt from state_dir on startup and after each refresh tick.
paths:
  state_dir: "/var/lib/signpost/state"

# ---- Sources --------------------------------------------------------------
# At least one source must be declared — signpost will refuse to start with
# an empty sources map. Source names appear in state filenames, log lines,
# and pool paths and must match ^[a-z0-9][a-z0-9._-]*$.
#
# Supported discovery types: github_release, latest_url, json_url, external.
# Uncomment and adapt:
sources: {}
#
# sources:
#   vendor-foo:
#     # enabled: true                           # default
#     discovery:
#       type: "github_release"
#       repo: "vendor/foo"                      # owner/name
#       asset: 'foo_.*_amd64\.deb'              # Go regex over release asset names
#       include_prerelease: false
#       # token_env: "GITHUB_TOKEN"             # overrides github.token_env for this source
#
#   vendor-bar:
#     discovery:
#       type: "latest_url"
#       # A stable URL that either returns the current .deb directly or 302s
#       # to the versioned download. signpost HEADs it each tick; token
#       # comes from the resolved URL after redirects, falling back to ETag
#       # then Last-Modified. When the resolved URL lives on AWS S3, the
#       # x-amz-checksum-sha256 metadata is used to skip the streaming hash.
#       url: "https://downloads.vendor-bar.example/bar-latest_amd64.deb"
#
#   vendor-zoom:
#     discovery:
#       type: "json_url"
#       # GET this endpoint, parse the JSON response, extract the token via
#       # gjson, render the asset URL by interpolating {token} or any
#       # {gjson.path}. Absorbs vendor download endpoints that publish JSON
#       # metadata (Discord, Slack, Zoom, Cypress, Postman, ...) without
#       # needing an external shim binary. Body is capped at 1 MiB.
#       url: "https://zoom.us/rest/download?os=linux"
#       token_path: "result.downloadVO.zoom.version"
#       asset_url: "https://zoom.us/client/{token}/zoom_amd64.deb"
#
#   vendor-baz:
#     discovery:
#       type: "external"
#       # Escape hatch for vendors with bespoke discovery (custom JSON APIs,
#       # signed manifests, etc). signpost spawns the command each tick with
#       # a stripped environment (HTTP_PROXY/HTTPS_PROXY/NO_PROXY plus the
#       # explicit env: map below) and pipes the stdio JSON contract from
#       # design.md:
#       #   stdin:  {"prev": {"url":"...","token":"..."}}   (omitted on cold start)
#       #   stdout: {"url":"...","token":"..."}             on change
#       #   stdout: {"unchanged": true}                     on no-op
#       # command[0] must be an absolute path; PATH is unset for the child.
#       command: ["/usr/local/libexec/discover-baz", "--channel", "stable"]
#       timeout: "30s"                          # hard kill of the process group at this point
#       env:                                    # explicit allowlist; nothing else passes through
#         BAZ_API_KEY: "${BAZ_API_KEY}"
